name: CI

on: push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Build Wasm Plugin
        run: make build

      # Keep these steps in sync with the Makefile's check prerequisites.
      - name: Check formatting
        run: make fmt

      - name: Lint Rust and Typst
        run: make lint

      - name: Run Rust and Typst tests
        run: make test

      - name: Build documentation
        run: make docs
